# Generated by OpsCrew and shared by every OpsCrew app on this server; any app's `opscrew provision` regenerates it.
# OpsCrew's shared edge on the server (/srv/edge, Compose project opscrew-edge), in front of
# every OpsCrew app there: Caddy and kamal-proxy. Each app's deploy brings this file and puts it
# in /srv/edge only when its x-opscrew-edge-version is larger than the server's, or when its
# x-opscrew-edge-proxy differs (the switch, while the server holds one OpsCrew app).
name: opscrew-edge
x-opscrew-edge-version: 2026110401
x-opscrew-edge-proxy: caddy
services:
  kamal-proxy:
    image: basecamp/kamal-proxy:v0.10.2@sha256:a686220c2aa42c4f9bbcfe851b1d21b2cedee0b5c389890c29d205282379da7c
    restart: unless-stopped
    volumes:
      - kamal-proxy-config:/home/kamal-proxy/.config/kamal-proxy
    mem_limit: 32m
    memswap_limit: 32m
    security_opt: &a1
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    cap_drop:
      - ALL
    networks:
      - opscrew-edge
  caddy:
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - ./sites:/etc/caddy/sites:ro
      - ./tls:/etc/caddy/tls:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:2019/config/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s
    labels:
      dev.opscrew.caddyfile-sha256: 12e498898e47715cc621f03fe3dd702f4ebe12bd83c92cbc87783d782a2ec269
    depends_on:
      - kamal-proxy
    security_opt: *a1
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - opscrew-edge
configs:
  caddyfile:
    content: |
      # OpsCrew's shared edge: each OpsCrew app on this server has its site in /srv/edge/sites/<app>.caddy.
      # Requests from Cloudflare's addresses carry the visitor's in CF-Connecting-IP.
      # Caddy's figures per hostname: the `metrics` handler below, on the edge's network only.
      {
      	servers {
      		trusted_proxies static 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22 2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32 2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32
      		client_ip_headers CF-Connecting-IP
      	}
      	metrics {
      		per_host
      	}
      }

      import /etc/caddy/sites/*.caddy

      # Caddy's figures, which Alloy reads with monitoring on: on the edge's internal network only (this port is never published).
      http://:9180 {
      	metrics
      }

      # Requests for any other hostname are refused.
      http:// {
      	abort
      }
      https:// {
      	abort
      }
networks:
  opscrew-edge:
    external: true
volumes:
  caddy_data: {}
  caddy_config: {}
  kamal-proxy-config: {}
