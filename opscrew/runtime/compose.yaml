# Generated by OpsCrew from opscrew/plan.yaml; `opscrew provision` regenerates it.
# The deploy workflow copies it to /srv/apps/seocc on the server.
name: seocc
services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE is not set; deploy with the OpsCrew workflow}
    restart: unless-stopped
    env_file:
      - app.env
    environment:
      PORT: "8080"
    volumes:
      - files:/app/storage
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - exit(@file_get_contents('http://127.0.0.1:'.getenv('PORT').'/')===false?1:0);
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 1s
    stop_grace_period: 35s
    mem_limit: 512m
    memswap_limit: 512m
    security_opt: &a1
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    cap_drop:
      - ALL
    networks:
      - internal
      - opscrew-edge
    depends_on:
      mysql:
        condition: service_healthy
  cron:
    image: ${APP_IMAGE:?APP_IMAGE is not set; deploy with the OpsCrew workflow}
    restart: unless-stopped
    env_file:
      - app.env
    environment:
      PORT: "8080"
    command:
      - exec supercronic /etc/opscrew/crontab
    volumes:
      - ./crontab:/etc/opscrew/crontab:ro
      - files:/app/storage
    labels:
      dev.opscrew.config-sha256: 324d11ed969bde7b350bb0a58947527b67f63b565dd09a47857368b70bf02246
    stop_grace_period: 10s
    healthcheck:
      disable: true
    mem_limit: 512m
    memswap_limit: 512m
    security_opt: *a1
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    cap_drop:
      - ALL
    networks:
      - internal
    depends_on:
      mysql:
        condition: service_healthy
  mysql:
    image: mysql:8.4@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
    restart: unless-stopped
    env_file:
      - mysql.env
    volumes:
      - /srv/data/seocc/mysql:/var/lib/mysql
      - ./services/mysql/my.cnf:/etc/mysql/conf.d/opscrew.cnf:ro
    labels:
      dev.opscrew.config-sha256: 5e13a08c858ca68edc7c32a53a0c388d13d346a79dbc0822c5b539624d5cf20d
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - 127.0.0.1
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    mem_limit: 512m
    memswap_limit: 512m
    security_opt: *a1
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - internal
networks:
  internal: {}
  opscrew-edge:
    external: true
volumes:
  files: {}
